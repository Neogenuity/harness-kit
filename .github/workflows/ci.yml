name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the BSD awk/tr, shasum, and readlink -f branches
        # the hooks rely on; Ubuntu covers the GNU userland.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Hook templates are executable
        run: |
          fails=0
          for f in plugins/harness-kit/skills/harness-kit/templates/scripts/harness/hooks/*.sh \
                   plugins/harness-kit/skills/harness-kit/templates/scripts/hooks/*.sh; do
            [ -x "$f" ] || { echo "not executable: $f"; fails=1; }
          done
          exit $fails
      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update -q && sudo apt-get install -qy shellcheck
            else
              brew install shellcheck
            fi
          fi
      # verify.sh is the executable definition of "done" (shellcheck ->
      # manifest JSON -> template regression tests -> check-harness.sh,
      # plus the evals gate). Running it directly here — rather than
      # reconstructing its steps one by one in this workflow — means a gate
      # added to verify.sh can never silently drop out of CI; the two used
      # to drift, which is exactly the failure mode this avoids. Needs git
      # + jq, both preinstalled on GitHub-hosted ubuntu-latest/macos-latest
      # runners.
      #
      # info/style shellcheck notices are acceptable in templates (helpers
      # sit next to commented TAILOR arms); the verify runner's shellcheck gate
      # fails on warning and above, and lints both the shipped templates and
      # the root-only tailored scripts (verify.sh, check-packaging.sh, …),
      # which have no template twin.
      - name: verify
        run: bash scripts/harness/verify

  # Windows / Git Bash. Deliberately NOT a third leg of the matrix above: that
  # job runs the full `verify`, whose gates (evals, the live-runtime fixture,
  # prettier-backed adapter checks) assume a POSIX toolchain the kit has never
  # claimed to support on Windows. This job covers the surface the kit DOES
  # claim — the floor an adopter's own gates.conf runs — so it can be green and
  # meaningful rather than red and ignored.
  #
  # It exists because issues #23/#25/#26/#27 were all found by an adopter on
  # Git Bash, on surfaces CI could not see: a CRLF checkout corrupting the ship
  # contract, binary-mode sha256 pins, and fixtures that assert on a state
  # Windows cannot construct. Each has a step below.
  #
  # Bonus coverage: this is the ONLY job that behaviorally executes the
  # installed copies under scripts/harness/tests/. Everywhere else they are
  # verified as bytes (template-sync + the integrity manifest), because
  # .harness/gates.conf globs only the templates tree.
  windows-floor:
    name: adopter floor (windows / git bash)
    timeout-minutes: 20
    runs-on: windows-latest
    defaults:
      run:
        # `bash` on a windows runner is Git Bash (MSYS2) — the reporters'
        # environment, not WSL and not a POSIX emulation layer we control.
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Environment facts
        run: |
          echo "bash            : $BASH_VERSION"
          echo "core.autocrlf   : $(git config --get core.autocrlf || echo '<unset>')"
          echo "jq              : $(command -v jq || echo MISSING)"
          echo "shasum          : $(command -v shasum || echo MISSING)"
          echo "sha256sum       : $(command -v sha256sum || echo MISSING)"
          printf 'x\n' > "$RUNNER_TEMP/hp.txt"
          # ' *' here means the tool defaults to BINARY mode — issue #25's cause.
          echo "shasum sep      : [$(shasum -a 256 "$RUNNER_TEMP/hp.txt" | sed 's/^[0-9a-f]*//' | cut -c1-2)]"
          echo "sha256sum sep   : [$(sha256sum "$RUNNER_TEMP/hp.txt" | sed 's/^[0-9a-f]*//' | cut -c1-2)]"
          echo "symlink capable : $(ln -s "$RUNNER_TEMP/hp.txt" "$RUNNER_TEMP/sp" 2>/dev/null && [ -L "$RUNNER_TEMP/sp" ] && echo yes || echo no)"

      # Regression guard for #27. .gitattributes pins eol=lf, so a Windows
      # checkout must NOT be CRLF even though core.autocrlf=true is the Git for
      # Windows default. Asserted on the ship contract and on an executable,
      # the two files whose parsers break first.
      - name: Checkout is LF, not CRLF
        run: |
          fails=0
          for f in scripts/harness/kit-manifest \
                   scripts/harness/verify \
                   plugins/harness-kit/skills/harness-kit/templates/scripts/harness/kit-manifest; do
            if LC_ALL=C grep -q $'\r' "$f"; then
              echo "FAIL: $f has CRLF line endings — .gitattributes is not holding"
              fails=1
            else
              echo "ok:   $f is LF"
            fi
          done
          exit $fails

      # Regression guard for #26: the floor an adopter runs. Cases whose
      # fixture Windows cannot build must SKIP loudly, never fail — and never
      # pass silently either, which is why the skips are echoed back here.
      - name: Shipped test floor
        if: always()
        run: |
          # Three suites fail here for reasons this PR did not introduce and
          # does not fix. They are excluded BY NAME and printed, never dropped
          # silently — a gate that quietly covers less than it appears to is the
          # failure mode this whole release is about. Tracked in
          # docs/plans/tech-debt.md under "Three shipped suites fail on Windows".
          known_gaps="test-audit-log.sh test-eval-graders.sh test-verify.sh"
          fails=0
          skipped=0
          for t in scripts/harness/tests/test-*.sh; do
            case " $known_gaps " in
              *" $(basename "$t") "*)
                echo "GAP:  $(basename "$t") — known Windows failure, see tech-debt.md"
                continue ;;
            esac
            out=$(bash "$t" 2>&1) || { fails=$((fails + 1)); }
            n=$(printf '%s\n' "$out" | grep -c '^SKIP:' || true)
            skipped=$((skipped + n))
            if printf '%s\n' "$out" | grep -qE '^(FAILED|FAIL:)'; then
              echo "=== $t ==="
              printf '%s\n' "$out"
            else
              printf 'ok:   %-34s %s\n' "$(basename "$t")" "$([ "$n" -gt 0 ] && echo "($n skipped)")"
            fi
          done
          echo "--- $skipped case(s) skipped for missing platform capabilities ---"
          echo "--- $(printf '%s' "$known_gaps" | wc -w) suite(s) excluded as known Windows gaps ---"
          exit $fails

      # Regression guard for #25: the pins this repo ships must verify on a
      # host whose hash tools default to binary mode ("<sha> *<path>").
      #
      # HARNESS_SKIP_TESTS_FAMILY=1 mirrors the adopter's own gates.conf: their
      # `parallel-each` runs the floor, so check-harness must not re-run it.
      # Without it this step swallowed the floor and reported only the last few
      # lines of each failing suite, hiding which case failed.
      - name: Integrity manifest verifies
        if: always()
        run: env HARNESS_SKIP_TESTS_FAMILY=1 bash scripts/harness/check-harness

      # Regression guard for #27's second half: bootstrap must parse the ship
      # contract and install cleanly here, which is the exact command that
      # failed with ~90 `unknown layer '<CR>'` errors.
      - name: bootstrap install into a scratch repo
        if: always()
        run: |
          target="$RUNNER_TEMP/adopter"
          mkdir -p "$target"
          git -C "$target" init -q
          bash scripts/harness/bootstrap install "$PWD/scripts" "$target"
          for f in scripts/harness/verify scripts/harness/kit-manifest .harness/gates.conf; do
            [ -f "$target/$f" ] || { echo "FAIL: bootstrap did not install $f"; exit 1; }
          done
          echo "ok:   bootstrap install produced a complete harness"
