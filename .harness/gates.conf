# .harness/gates.conf — THIS repo's quality-gate declarations, run by
# `bash scripts/harness/verify` (the kit-owned runner; this file is the
# repo-owned policy half). One gate per line:
#
#   gate          <label> <command...>     # both modes; keep fast (ms-s)
#   full          <label> <command...>     # serial; skipped under --fast
#   parallel      <label> <command...>     # independent; queued to the barrier
#   parallel-each <label-prefix> <glob...> # one parallel gate per matching
#                                          # file; each runs `bash <file>`
#
# Commands run via `bash -c` from the repo root. Keep serial gates
# cheapest-first; a `full` gate is a barrier for parallel gates declared
# before it. Only parallelize gates that do not consume one another's
# outputs or share mutable fixtures.

# -- TAILOR: the quality gates -------------------------------------------------
# This repo is shell + markdown + JSON: lint every script (shipped templates
# and the installed copies), validate the plugin manifests, run the template
# regression tests, and the harness drift gate.
gate shellcheck T=plugins/harness-kit/skills/harness-kit/templates/scripts; C="bootstrap verify sync check-harness check-instructions check-docs detect-drift validate-plan run-evals"; shellcheck -x --severity=warning $T/hooks/*.sh $T/harness/lib/*.sh $T/harness/hooks/*.sh $T/harness/tests/*.sh $(for c in $C; do echo "$T/harness/$c" "scripts/harness/$c"; done) scripts/*.sh scripts/harness/lib/*.sh scripts/harness/hooks/*.sh scripts/harness/tests/*.sh .harness/hooks/*.sh .harness/evals/scenarios/verify-live-runtime/*.sh .harness/evals/scenarios/verify-live-runtime/fixture/*.sh .harness/evals/scenarios/verify-live-runtime/reference/*.sh
full manifests bash scripts/check-packaging.sh
# Every template regression script owns its scratch fixtures — safe to
# schedule independently.
parallel-each template-test plugins/harness-kit/skills/harness-kit/templates/scripts/harness/tests/test-*.sh
# Root-only dogfood gates: provider templates (#8d), template<->install
# byte-sync, fixture isolation (the v0.18.0 leak class), and the
# maintainer-only install/update/recovery + checker conformance suites
# (descoped from the shipped set in v0.22.0, and the install-mechanics smoke
# test descoped again in v0.29.0 — an adopter's floor is the hook, library and
# runtime suites plus grader validity, with no smoke test at all; these
# tailored root copies keep proving the kit's own install/update/recovery and
# checker contracts).
parallel provider-templates bash scripts/test-provider-templates.sh
parallel template-sync bash scripts/test-template-sync.sh
# Shipped prose must not promise mechanism adopters never receive. The kit
# repo keeps maintainer-only scripts at root, so a template citing one passes
# every check that looks at THIS tree — the silent failure behind issue #13
# (and the v0.23.0 retired-path rot). Root-only: it reasons about the layout.
parallel shipped-doc-refs bash scripts/test-shipped-doc-refs.sh
parallel fixture-isolation bash scripts/test-fixture-isolation.sh
# THIS repo's tailored stop-hook policy (.harness/hooks/guard-project-policy.sh
# TAILOR block). Root-only by necessity, not preference: the shipped
# test-guard-project-policy.sh resolves whichever tailored hook a checkout
# provides, so it can only assert the mechanism-level properties every install
# shares -- the dogfood rules (mechanism change needs a test, and a version
# bump before release) have no counterpart in an adopter's hook.
parallel project-policy bash scripts/test-project-policy.sh
parallel install-suite-core bash scripts/test-install-core.sh
parallel install-suite-update bash scripts/test-install-update.sh
parallel install-suite-migrate bash scripts/test-install-migrate.sh
parallel install-suite-smoke bash scripts/test-install-smoke.sh
parallel install-suite-recovery bash scripts/test-install-recovery.sh
parallel checker-suite bash scripts/test-check-harness.sh
# Behavioral-eval machinery conformance (pass@k math, schema, scorer, runner
# guards) — kit-only; adopters have no use for it.
parallel evals bash scripts/test-eval.sh
# Grader validity for THIS repo's real 13-task bank. The installed copy of the
# shipped test, run against the real bank exactly as an adopter would; the
# template-test copy above only sees the shipped _template's empty bank, so
# this is the one floor entry whose behavior is NOT covered by the byte-identical
# template run. Parallel, because serialized inside check-harness #6 it lands on
# the critical path (+~50s of workspace clones).
parallel eval-graders bash scripts/harness/tests/test-eval-graders.sh
# Root-only deterministic proof of the app runtime contract. Python 3 is a
# harness-kit contributor prerequisite, not an installed-harness dependency.
parallel runtime-fixture bash .harness/evals/scenarios/verify-live-runtime/test-fixture.sh
# The full harness coherence check. HARNESS_SKIP_TESTS_FAMILY drops check #6's serial re-run
# of the installed floor: the template-test gates above already run the
# byte-identical template copies (byte-identity is itself proven by the
# template-sync gate), and the one entry whose BEHAVIOR differs between the two
# copies — test-eval-graders.sh, which reads this repo's real task bank rather
# than the template's empty one — has its own parallel gate above. Leaving it
# inside #6 put ~50s of workspace clones on the serial critical path.
# This dedup only exists in THIS dogfood repo — a user install keeps the
# shipped default gates.conf, where the floor runs via parallel-each.
parallel harness env HARNESS_SKIP_TESTS_FAMILY=1 bash scripts/harness/check-harness
# ------------------------------------------------------------------------------
